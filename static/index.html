<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GhostExplain</title>
    <style>
      :root { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      body { margin: 0; background: #f5f7fb; color: #1f2937; }
      .container { max-width: 960px; margin: 0 auto; padding: 24px; }
      h1 { margin-bottom: 8px; }
      p { margin-top: 0; color: #4b5563; }
      .card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06); margin-bottom: 16px; }
      textarea { width: 100%; min-height: 280px; resize: vertical; border: 1px solid #d1d5db; border-radius: 8px; padding: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 14px; }
      .actions { display: flex; gap: 8px; margin-top: 12px; }
      button { border: none; border-radius: 8px; padding: 10px 14px; cursor: pointer; font-weight: 600; }
      .primary { background: #111827; color: #fff; }
      .secondary { background: #e5e7eb; color: #111827; }
      .status { margin-top: 8px; font-size: 14px; color: #6b7280; }
      #result { white-space: pre-wrap; font-family: Inter, system-ui, sans-serif; line-height: 1.5; }
      .hidden { display: none; }
      .meta { color: #6b7280; font-size: 14px; margin-bottom: 12px; }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>GhostExplain</h1>
      <p>Вставьте код и получите понятное объяснение на русском языке.</p>

      <section class="card">
        <label for="codeInput"><strong>Код</strong></label>
        <textarea id="codeInput" placeholder="Вставьте код сюда..."></textarea>
        <div class="actions">
          <button id="explainBtn" class="primary">Объяснить код</button>
          <button id="copyBtn" class="secondary hidden">Скопировать</button>
        </div>
        <div class="status" id="status"></div>
      </section>

      <section class="card">
        <div class="meta" id="languageMeta">Язык: —</div>
        <div id="result">Здесь появится объяснение в markdown-формате.</div>
      </section>
    </main>

    <script>
      const codeInput = document.getElementById('codeInput');
      const explainBtn = document.getElementById('explainBtn');
      const copyBtn = document.getElementById('copyBtn');
      const statusEl = document.getElementById('status');
      const resultEl = document.getElementById('result');
      const languageMeta = document.getElementById('languageMeta');

      explainBtn.addEventListener('click', async () => {
        const code = codeInput.value.trim();
        if (!code) {
          statusEl.textContent = 'Добавьте код перед отправкой.';
          return;
        }

        explainBtn.disabled = true;
        statusEl.textContent = 'Обрабатываю...';

        try {
          const response = await fetch('/api/explain', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code }),
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.detail || 'Ошибка сервера');
          }

          languageMeta.textContent = `Язык: ${data.language}`;
          resultEl.textContent = data.explanation_markdown;
          copyBtn.classList.remove('hidden');
          statusEl.textContent = 'Готово.';
        } catch (error) {
          statusEl.textContent = error.message || 'Не удалось получить объяснение.';
        } finally {
          explainBtn.disabled = false;
        }
      });

      copyBtn.addEventListener('click', async () => {
        const text = resultEl.textContent;
        if (!text) return;
        try {
          await navigator.clipboard.writeText(text);
          statusEl.textContent = 'Скопировано.';
        } catch {
          statusEl.textContent = 'Не удалось скопировать.';
        }
      });
    </script>
  </body>
</html>
